schema_version: "1.0"

# Governance metadata for voice indexes ({slug}-index.md).
# Matching logic stays in shelf_index_utils (shelf_capture_excluded / guest-index capture helpers) — YAML documents exclusions only.

voices:
  pape:
    status: canonical
    builder: scripts/build_pape_index.py
    curated_overlays: []
    exclusions:
      - verify-pape-* and x-pape-* stub captures excluded from guest parity
      - date-only source-pape-YYYY-MM-DD stubs unless Cyrus Janssen studio lane
      - legacy strategy-notebook transcript paths in source_path

  ritter:
    status: canonical
    builder: scripts/build_ritter_index.py
    curated_overlays:
      - forecast ledger + interview appearances companions
    exclusions:
      - date-only source-ritter-YYYY-MM-DD stubs excluded from index parity
      - verify-ritter-* and ritter-rant-* prefixes excluded

  crooke:
    status: canonical
    builder: scripts/build_crooke_index.py
    curated_overlays: []
    exclusions:
      - legacy YYYY-MM-DD-crooke.md dated filenames excluded
      - transcript-crooke.md and verify-crooke-* stubs excluded

  jiang:
    status: canonical
    builder: scripts/build_jiang_index.py
    curated_overlays: []
    exclusions:
      - PH-owned filenames (source-game-theory-, source-gb-, source-predictive-history-, source-interviews-* except Sneako dual-index)
      - Dialogue Works host rows about Jiang excluded
      - source_form solo excluded from external-interview bench

  jermy:
    status: canonical
    builder: scripts/build_jermy_index.py
    curated_overlays:
      - Cross-weave note links (Mercouris/Diesen same-day; no orphan archive links)
    exclusions: []

  karaganov:
    status: canonical
    builder: scripts/build_karaganov_index.py
    curated_overlays:
      - Reaction / reinforcement table (routing only; not parity captures)
      - Escalation-ladder lattice May–Jun 2026
    exclusions:
      - reaction-tier source-ritter-* captures citing Karaganov token are not guest appearances
      - lascaris embed captures cited for clip SSOT / tension pairs only (plain-text refs in index)

  kent:
    status: canonical
    builder: scripts/build_kent_index.py
    curated_overlays: []
    exclusions:
      - support-tier panel rows may appear in index but are not primary guest corpus for parity warnings

