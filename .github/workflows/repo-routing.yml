name: Repo routing validation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  repo-routing:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Validate LLM routing surfaces
        run: python3 scripts/validate_repo_routing.py --strict
