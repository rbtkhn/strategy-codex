name: Repo routing validation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  repo-routing:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Validate LLM routing surfaces
        run: python3 scripts/validate_repo_routing.py --strict

      - name: LLM routing generator drift check
        run: python3 scripts/generate_llm_routing.py --check

      - name: Generated surface manifest (headers)
        run: python3 scripts/check_generated_surfaces.py --headers-only --strict

      - name: Generated surface drift orchestrator (warn)
        run: python3 scripts/check_generated_surfaces.py --check
        continue-on-error: true
