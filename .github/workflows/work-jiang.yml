# Predictive History is now external-only; this workflow protects the boundary.
name: predictive-history-boundary

on:
  push:
    branches: [main]
    paths:
      - "continuity/predictive-history/**"
      - "research/external/youtube-channels/predictive-history/**"
      - "docs/predictive-history-external-boundary.md"
      - "docs/skill-work/work-strategy/daily-brief-jiang-layer.md"
      - "docs/skill-work/work-strategy/predictive-history-review-packets.md"
      - "scripts/work_jiang/**"
      - "scripts/validate_predictive_history_boundary.py"
      - ".github/workflows/work-jiang.yml"
  pull_request:
    branches: [main]
    paths:
      - "continuity/predictive-history/**"
      - "research/external/youtube-channels/predictive-history/**"
      - "docs/predictive-history-external-boundary.md"
      - "docs/skill-work/work-strategy/daily-brief-jiang-layer.md"
      - "docs/skill-work/work-strategy/predictive-history-review-packets.md"
      - "scripts/work_jiang/**"
      - "scripts/validate_predictive_history_boundary.py"
      - ".github/workflows/work-jiang.yml"

jobs:
  boundary:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install pytest
        run: pip install "pytest>=7.0"

      - name: Validate Predictive History boundary
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            python3 scripts/validate_predictive_history_boundary.py --diff "${{ github.event.pull_request.base.sha }}...${{ github.event.pull_request.head.sha }}"
          else
            BEFORE="${{ github.event.before }}"
            if [ -n "$BEFORE" ] && [ "$BEFORE" != "0000000000000000000000000000000000000000" ]; then
              python3 scripts/validate_predictive_history_boundary.py --diff "${BEFORE}...${{ github.sha }}"
            else
              echo "Skipping diff-based PH boundary check for zero-before push."
            fi
          fi

      - name: Pytest Predictive History boundary
        run: pytest tests/test_validate_predictive_history_boundary.py -q
