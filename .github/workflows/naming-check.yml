# Naming, layout, path adoption, and complexity baseline (strategy-codex active)
name: Naming check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  naming:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Check for deprecated COG-EM naming
        run: python scripts/check_deprecated_naming.py

      - name: Check work-cici active-prose drift
        run: python scripts/check_work_cici_drift.py

      - name: Root folder layout (20 cap)
        run: python scripts/assert_root_folder_layout.py

      - name: Repo path resolver adoption
        run: python scripts/check_repo_path_adoption.py --max-literals 0

      - name: Root profile export nest
        run: python scripts/assert_root_profile_exports.py


      - name: Complexity audit (baseline report)
        run: python3 scripts/audit_repo_complexity.py

      - name: Archive boundary (warn mode)
        run: python3 scripts/check_archive_boundary.py

      - name: Repo path strict scan (warn mode)
        run: python3 scripts/check_repo_path_strict.py

