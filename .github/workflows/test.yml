# Run pytest and integrity/governance checks on push and PR.
name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Tri-frame civ-mem routing smoke test
        run: python3 scripts/test_civmem_tri_frame_routing.py

      - name: MEM relevance suggester smoke (AMERICA)
        run: |
          python3 scripts/suggest_civ_mem_from_relevance.py AMERICA | head -40
          python3 scripts/suggest_civ_mem_from_relevance.py AMERICA >/dev/null

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Validate Predictive History boundary
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            python3 scripts/validate_predictive_history_boundary.py --diff "${{ github.event.pull_request.base.sha }}...${{ github.event.pull_request.head.sha }}"
          else
            BEFORE="${{ github.event.before }}"
            if [ -n "$BEFORE" ] && [ "$BEFORE" != "0000000000000000000000000000000000000000" ]; then
              python3 scripts/validate_predictive_history_boundary.py --diff "${BEFORE}...${{ github.sha }}"
            else
              echo "Skipping diff-based PH boundary check for zero-before push."
            fi
          fi

      - name: Prose slop lint (essays, advisory)
        continue-on-error: true
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            python3 scripts/prose_slop_lint.py --diff "${{ github.event.pull_request.base.sha }}...${{ github.event.pull_request.head.sha }}" essays/
          else
            BEFORE="${{ github.event.before }}"
            if [ -n "$BEFORE" ] && [ "$BEFORE" != "0000000000000000000000000000000000000000" ]; then
              python3 scripts/prose_slop_lint.py --diff "${BEFORE}...${{ github.sha }}" essays/ || true
            else
              echo "Skipping diff-based prose slop lint for zero-before push."
            fi
          fi

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install -r requirements-dev.txt
          pip install -r archive/grace-mar-instance/bot/requirements.txt
          pip install -e .
          pip install -e ".[reflect]"

      - name: Verify package CLI (strategy-codex warmup default)
        run: |
          python -c "from pathlib import Path; from grace_mar.repo_io import repo_root; r = repo_root(); assert (r / 'platform/users').is_dir(), r"
          grace-mar --help
          grace-mar warmup -u strategy-codex --compact | head -1
          grace-mar reflect --help | head -1

      - name: Fork-language audit (strict)
        run: python3 scripts/audit_fork_language.py --strict --errors-only

      - name: Validate Grace-Mar stub redirects
        run: python3 scripts/validate_grace_mar_stub_redirects.py

      - name: Run pytest
        run: pytest tests/ -v --tb=short
        working-directory: ${{ github.workspace }}

      - name: Assert canonical paths
        run: python scripts/assert_canonical_paths.py --user grace-mar

      - name: Validate integrity (frozen Grace-Mar Record — archaeology)
        run: python scripts/validate-integrity.py --user grace-mar --require-proposal-class

      - name: Validate template sync contract
        run: python scripts/validate_template_sync_contract.py

      - name: Validate strategy-notebook knot index (legacy; may be empty)
        run: python3 scripts/validate_knot_index.py

      - name: Validate strategy-page fences in expert threads
        run: python3 scripts/validate_strategy_pages.py

      - name: Verify Ritter refined pages (manifest + spine)
        run: python3 scripts/strategy/verify_ritter_refined_pages.py

      - name: Verify Mearsheimer refined pages (manifest + spine)
        run: python3 scripts/strategy/verify_ritter_refined_pages.py --expert mearsheimer

      - name: Validate strategy expert threads (Segment 1 prose hints)
        run: python3 scripts/validate_strategy_expert_threads.py

      - name: Validate strategy expert predictions ledger
        run: python3 scripts/validate_expert_predictions.py

      - name: Validate history-notebook Bookshelf catalog
        run: python3 scripts/validate_bookshelf_catalog.py

      - name: Check history-notebook generated shelf bibliography
        run: python3 scripts/build_hn_bookshelf_bibliography.py --check

      - name: Check history-notebook shelf anchors by chapter
        run: python3 scripts/hn_shelf_anchors.py --check

      - name: Check history-notebook autopriority queue
        run: python3 scripts/build_hn_autopriority_queue.py --check

      - name: Check history-notebook provenance packets
        run: python3 scripts/build_hn_provenance_packets.py --check

      - name: Check history-notebook red-team findings
        run: python3 scripts/build_hn_redteam_findings.py --check

      - name: Strategy notebook knot weave_count drift check
        run: python3 scripts/knot_seam_metrics.py --strict-drift

      - name: Fork lifecycle unit tests
        run: pytest tests/test_fork_lifecycle.py -v --tb=short

      - name: Check statecraft archive indices
        run: python3 scripts/refresh_statecraft_archive_indices.py --check

      - name: Validate statecraft daily synthesis (advisory until shelf retrofit)
        run: python3 scripts/validate_statecraft_daily_synthesis.py
        continue-on-error: true

      - name: Check statecraft intake vs daily sync (advisory)
        run: python3 scripts/check_statecraft_intake_daily_sync.py --latest
        continue-on-error: true

      - name: Governance check
        run: python scripts/governance_checker.py

      - name: Validate structured governance files
        run: python scripts/validate_structured_files.py

      - name: Run deterministic diagnostics
        run: python3 scripts/run_deterministic_diagnostics.py

      - name: Validate work-dev control plane
        run: python scripts/work_dev/validate_control_plane.py

      - name: Workbench preflight (pilot + visualizer smoke, skip generator freshness in CI)
        run: python3 scripts/work_dev/preflight_workbench.py --skip-freshness

      - name: Autonomy tier evaluator smoke (GAP-007)
        run: |
          out=$(python3 scripts/work_dev/evaluate_autonomy_tiers.py)
          echo "$out"
          test "$out" = "insufficient_data"
