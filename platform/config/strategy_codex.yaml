# strategy-codex product config (WORK; not Record)
# SSOT for operator defaults and Grace-Mar instance freeze posture.
schema_version: "1.0.0"

# Grace-Mar Record is museum-only; strategy-codex is a governed interpretive machine.
record_frozen: true
record_surfaces: museum_only
continuity_file: memory.md
museum_doc: docs/archive/grace-mar-record-museum.md
operator_books_routing: misc_folders

# Default harness / coffee / warmup user id (not the legacy grace-mar instance label).
default_operator_user: strategy-codex

# When record_frozen: prefer interpretive-machine health nudges over gate/capture-gap metrics.
health_nudges:
  - stale_archive_indices
  - statecraft_daily_synthesis_validators
  - ship_receipt
  - channel_handoff

# Explicit revive tokens (see docs/grace-mar-instance-boundary.md)
fork_revive_tokens:
  - grace-mar archive
  - fork revive
  - A gate
  - "--territory companion"

# Public Civilizational Statecraft book (after v0.1.0 cutover)
civilizational_statecraft_public:
  canonical_repo: "https://github.com/rbtkhn/civ-state"
  legacy_repo: "https://github.com/rbtkhn/civ-emp"
  export_staging: "public/civ-state"
  export_manifest: "platform/config/civilizational_statecraft_public_export.yaml"
  observe_only_workshop_paths_after_cutover: true
  release_tag: "v0.1.1"
  cutover_date: "2026-06-15"
