# --- Phase 1 download hints (operator / future script) ---

download_hints:
  gutenberg_epub: "https://www.gutenberg.org/ebooks/{gutenberg_id}.epub3.images"
  gutenberg_txt: "https://www.gutenberg.org/files/{gutenberg_id}/{gutenberg_id}-0.txt"
  internet_archive_metadata: "https://archive.org/metadata/{ia_identifier}"
  internet_archive_download: "https://archive.org/download/{ia_identifier}/{ia_identifier}.epub"
