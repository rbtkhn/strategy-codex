version: 1

schemas:
  prediction:
    path: schemas/statecraft/prediction.schema.json
    applies_to: statecraft/notes/predictions/*.md
    format: markdown_frontmatter
    scope: prediction

  event_registry:
    path: schemas/statecraft/event.schema.json
    applies_to: statecraft/data/event-registry.json
    format: json_object_map
    scope: prediction

  prediction_registry:
    path: schemas/runtime/prediction-registry.schema.json
    applies_to: runtime/artifacts/prediction-registry.json
    format: json
    scope: prediction

  prediction_metrics:
    path: schemas/runtime/prediction-metrics.schema.json
    applies_to: runtime/artifacts/prediction-metrics.json
    format: json
    scope: prediction

  epistemic_state:
    path: schemas/runtime/epistemic-state.schema.json
    applies_to: runtime/artifacts/epistemic_state.json
    format: json
    scope: prediction

  epistemic_signals:
    path: schemas/runtime/signals.schema.json
    applies_to: runtime/artifacts/signals.json
    format: json
    scope: prediction

  epistemic_regimes:
    path: schemas/runtime/regimes.schema.json
    applies_to: runtime/artifacts/regimes.json
    format: json
    scope: prediction

  multivoice_dataset:
    path: schemas/runtime/multivoice-dataset.schema.json
    applies_to: runtime/artifacts/multivoice_dataset.json
    format: json
    scope: prediction

  epistemic_enriched:
    path: schemas/runtime/epistemic-enriched.schema.json
    applies_to: runtime/artifacts/epistemic_enriched.json
    format: json
    scope: prediction

  dream:
    path: schemas/runtime/dream.schema.json
    applies_to: runtime/daily-handoff/last-dream.json
    format: json
    scope: runtime

  operator_event_line:
    path: schemas/skills/operator-event-line.schema.json
    applies_to: runtime/operator-events/*.jsonl
    format: jsonl
    scope: runtime

  singularity_loop:
    path: schemas/singularity/loop.schema.json
    applies_to: singularity/loops/**/*.yaml
    format: yaml
    scope: singularity

  loop_registry:
    path: schemas/runtime/loop-registry.schema.json
    applies_to: runtime/artifacts/loop-registry.json
    format: json
    scope: singularity

  singularity_signals:
    path: schemas/runtime/singularity-signals.schema.json
    applies_to: runtime/artifacts/singularity-signals.json
    format: json
    scope: singularity

  singularity_loop_run:
    path: schemas/runtime/singularity-loop-run.schema.json
    applies_to: runtime/operator-events/singularity-loop-runs.jsonl
    format: jsonl
    scope: singularity

  singularity_action_card:
    path: schemas/runtime/singularity-action-card.schema.json
    applies_to: singularity/action-cards/*/**/*.md
    format: markdown_frontmatter
    scope: singularity

  moonshots_intelligence:
    path: schemas/singularity/moonshots-intelligence.schema.json
    applies_to: research/singularity-science/moonshots/moonshots-*-intelligence.json
    format: json
    scope: singularity
