version: 1

schemas:
  prediction:
    path: schemas/statecraft/prediction.schema.json
    applies_to: statecraft/notes/predictions/*.md
    format: markdown_frontmatter
    scope: prediction

  event_registry:
    path: schemas/statecraft/event.schema.json
    applies_to: statecraft/data/event-registry.json
    format: json_object_map
    scope: prediction

  prediction_registry:
    path: schemas/runtime/prediction-registry.schema.json
    applies_to: runtime/artifacts/prediction-registry.json
    format: json
    scope: prediction

  prediction_metrics:
    path: schemas/runtime/prediction-metrics.schema.json
    applies_to: runtime/artifacts/prediction-metrics.json
    format: json
    scope: prediction

  prediction_signals:
    path: schemas/runtime/prediction-signals.schema.json
    applies_to: runtime/artifacts/prediction-signals.json
    format: json
    scope: prediction

  prediction_regime_summary:
    path: schemas/runtime/prediction-regime-summary.schema.json
    applies_to: runtime/artifacts/prediction-regime-summary.json
    format: json
    scope: prediction

  epistemic_generative_state:
    path: schemas/runtime/epistemic-generative-state.schema.json
    applies_to: runtime/artifacts/epistemic-generative-state.json
  epistemic_calibration_loss:
    path: schemas/runtime/epistemic-calibration-loss.schema.json
    applies_to: runtime/artifacts/epistemic-calibration-loss.json
  signal_prediction_tasks:
    path: schemas/runtime/signal-prediction-tasks.schema.json
    applies_to: runtime/artifacts/signal-prediction-tasks.json
  epistemic_dataset:
    path: schemas/runtime/epistemic-dataset.schema.json
    applies_to: runtime/artifacts/epistemic-dataset.json
    format: json
    scope: prediction
  baseline_forecast_metrics:
    path: schemas/runtime/baseline-forecast-metrics.schema.json
    applies_to: runtime/artifacts/baseline-forecast-metrics.json
    format: json
    scope: prediction
  ablation_study:
    path: schemas/runtime/ablation-study.schema.json
    applies_to: runtime/artifacts/ablation-study.json
    format: json
    scope: prediction
  multivoice_extracted_dataset:
    path: schemas/runtime/multivoice-extracted-dataset.schema.json
    applies_to: runtime/artifacts/multivoice-extracted-dataset.json
    format: json
    scope: prediction
  event_alignment_map:
    path: schemas/runtime/event-alignment-map.schema.json
    applies_to: runtime/artifacts/event-alignment-map.json
    format: json
    scope: prediction
  voice_trajectories:
    path: schemas/runtime/voice-trajectories.schema.json
    applies_to: runtime/artifacts/voice-trajectories-*.json
    format: json
    scope: prediction

  dream:
    path: schemas/runtime/dream.schema.json
    applies_to: runtime/daily-handoff/last-dream.json
    format: json
    scope: runtime

  operator_event_line:
    path: schemas/skills/operator-event-line.schema.json
    applies_to: runtime/operator-events/*.jsonl
    format: jsonl
    scope: runtime

  singularity_loop:
    path: schemas/singularity/loop.schema.json
    applies_to: singularity/loops/**/*.yaml
    format: yaml
    scope: singularity

  loop_registry:
    path: schemas/runtime/loop-registry.schema.json
    applies_to: runtime/artifacts/loop-registry.json
    format: json
    scope: singularity

  singularity_signals:
    path: schemas/runtime/singularity-signals.schema.json
    applies_to: runtime/artifacts/singularity-signals.json
    format: json
    scope: singularity

  singularity_loop_run:
    path: schemas/runtime/singularity-loop-run.schema.json
    applies_to: runtime/operator-events/singularity-loop-runs.jsonl
    format: jsonl
    scope: singularity

  singularity_action_card:
    path: schemas/runtime/singularity-action-card.schema.json
    applies_to: singularity/action-cards/*/**/*.md
    format: markdown_frontmatter
    scope: singularity
