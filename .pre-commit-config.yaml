# Optional pre-commit hooks for Grace-Mar
# Install: pip install pre-commit && pre-commit install && pre-commit install --hook-type commit-msg
# Run manually: pre-commit run --all-files

repos:
  - repo: local
    hooks:
      - id: deprecated-naming-check
        name: Deprecated naming check
        entry: python scripts/check_deprecated_naming.py
        language: system
        pass_filenames: false
      - id: work-record-doctrine-check
        name: Deprecated WORK/Record banner check
        entry: python scripts/check_work_record_doctrine.py --staged
        language: system
        pass_filenames: false
      - id: governance-check
        name: Governance checker
        entry: python scripts/governance_checker.py
        language: system
        pass_filenames: false
      - id: integrity-check
        name: Integrity validator
        entry: python scripts/validate-integrity.py --json
        language: system
        pass_filenames: false
      - id: ph-civ-transcript-boundary
        name: PH-CIV transcript immutability
        entry: python scripts/validate_ph_civ_transcript_boundary.py --staged
        language: system
        pass_filenames: false
      - id: gated-record-commit-msg
        name: Gated Record commit token
        entry: python scripts/check_gated_record_commit_msg.py
        language: system
        stages: [commit-msg]
        pass_filenames: false
        always_run: true
