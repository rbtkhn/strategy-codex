loop:
  id: predictive-history-education
  category: projects
  trigger:
    type: event
    description: New or updated lecture, essay, interview, route, or chapter material in rbtkhn/predictive-history suitable for learner-facing curriculum conversion
  inputs:
    - description: Canonical public corpus from rbtkhn/predictive-history, especially data/cards.jsonl, docs/predictive-history-index.md/json, llms-full.txt, and chapter folders
    - description: Selected lecture, essay, interview, route, or chapter candidate for learner-facing conversion
    - description: Target learner profile and lesson objective
    - description: STRATEGIC-PLAN.md — operating SSOT for pedagogy, pipeline, distribution, and corpus boundary
    - description: Existing curriculum/media artifacts under singularity/education/predictive-history/ for continuity
    - description: In-repo mirror continuity/predictive-history/ for read/cite only (corpus edits stay in canonical clone)
  process:
    steps:
      - description: Select one canonical corpus item or route from rbtkhn/predictive-history
      - description: Confirm chapter id, source path, route context, and target learner
      - description: Route the item to predictive-history-lesson-pipeline
      - description: Do not duplicate corpus taxonomy or canonical source records inside singularity/
  outputs:
    - description: Intake record linking lecture/chapter to lesson-id and target learner
    - description: Routing handoff to lesson-pipeline cluster
  state:
    status: active
  dependencies: []
  last_run: null
  output_shelves:
    - singularity/education/predictive-history/
