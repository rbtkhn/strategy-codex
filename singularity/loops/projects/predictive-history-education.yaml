loop:
  id: predictive-history-education
  category: projects
  trigger:
    type: event
    description: New or updated lecture or chapter material in rbtkhn/predictive-history suitable for learner-facing curriculum conversion
  inputs:
    - description: Upstream corpus at https://github.com/rbtkhn/predictive-history/ and in-repo mirror continuity/predictive-history/ (corpus edits stay in canonical clone; outputs land on education shelf)
    - description: STRATEGIC-PLAN.md — operating SSOT for pedagogy, pipeline, distribution, and risk register
    - description: Target learner profile (adult reader, high school, middle school, first grade)
    - description: Existing lesson, media, distribution, or feedback artifacts under singularity/education/predictive-history/ for continuity
  process:
    steps:
      - description: Identify one lecture, chapter, historical prediction case, or concept suitable for a learner-facing unit
      - description: Confirm source grounding and learner profile with operator
      - description: Route unit to predictive-history-lesson-pipeline — do not produce monolithic video in this loop
      - description: Note downstream pipeline — media-pack → media-quality-gate → distribution-pack → learner-feedback-review
  outputs:
    - description: Intake record linking lecture/chapter to lesson-id and target learner
    - description: Routing handoff to lesson-pipeline cluster
  state:
    status: active
  dependencies: []
  last_run: null
  output_shelves:
    - singularity/education/predictive-history/
