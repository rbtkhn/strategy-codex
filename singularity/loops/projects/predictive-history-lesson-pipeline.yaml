loop:
  id: predictive-history-lesson-pipeline
  category: projects
  trigger:
    type: event
    description: Education intake routes a canonical corpus unit ready for learner-facing lesson conversion
  inputs:
    - description: Canonical chapter/card/index material from rbtkhn/predictive-history, especially data/cards.jsonl, docs/predictive-history-index.md/json, lecture/essay/interview chapter folders, transcripts, and commentary canvases
    - description: Selected unit from predictive-history-education intake, including chapter id, route, target learner, and lesson objective
    - description: STRATEGIC-PLAN.md pedagogical spine, corpus boundary, and lessons/lesson-template.md
    - description: Existing learner-facing artifacts under singularity/education/predictive-history/
  process:
    steps:
      - description: Ground lesson in canonical Predictive History source material; do not create new corpus records here
      - description: Convert the selected source unit into a lesson brief, worksheet, quiz, answer key, and media requirements
      - description: Preserve links back to canonical repo paths and chapter/card ids
      - description: Draft lesson brief following 10-step pedagogical spine (hook through reflection)
      - description: Produce worksheet aligned to learning objectives
      - description: Produce retrieval quiz with answer key
      - description: Compile source packet (quotes, citations, evidence list)
      - description: Verify method spine visible — case → forecast → evidence → outcome → evaluation
      - description: Route approved lesson package to predictive-history-media-pack
  outputs:
    - description: Lesson brief per lesson-id
    - description: Worksheet and answer guidance
    - description: Quiz and answer key
    - description: Source packet with citations
  state:
    status: active
  dependencies:
    - loop_id: predictive-history-education
  last_run: null
  output_shelves:
    - singularity/education/predictive-history/lessons/
    - singularity/education/predictive-history/worksheets/
    - singularity/education/predictive-history/quizzes/
    - singularity/education/predictive-history/source-packets/
