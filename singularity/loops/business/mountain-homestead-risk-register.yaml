loop:
  id: mountain-homestead-risk-register
  category: business
  trigger:
    type: time
    schedule: monthly
    description: Monthly risk register update for the 5-acre Pine, Colorado mountain homestead business asset
  inputs:
    - description: Weekly ops cards, maintenance backlog, wildfire mitigation notes, utilities continuity notes, water and septic status, access issues, weather outlook, and insurance concerns
    - description: Risk scoring model and template at operations/mountain-homestead/risk-register/risk-register-template.md and STRATEGIC-PLAN.md
  process:
    steps:
      - description: Score each risk by consequence, likelihood, urgency, and cost-to-reduce
      - description: Rank top five risk-reduction actions
      - description: Identify which loop owns each action
      - description: Escalate any risk that threatens habitability, insurability, access, water, heat, or asset value
  outputs:
    - description: Monthly homestead risk register
    - description: Top five risk-reduction actions
    - description: Escalation list for weekly ops and maintenance
  state:
    status: active
  dependencies:
    - loop_id: mountain-homestead-ops
  last_run: null
  output_shelves:
    - operations/mountain-homestead/risk-register/
