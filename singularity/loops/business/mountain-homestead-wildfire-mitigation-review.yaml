loop:
  id: mountain-homestead-wildfire-mitigation-review
  category: business
  trigger:
    type: time
    schedule: monthly
    description: Monthly wildfire mitigation review for structures, defensible space, and ignition hazards on the Pine, Colorado homestead
  inputs:
    - description: Current home ignition zone status, structure list, defensible-space notes, roof/gutter/deck debris status, vent/fence/siding condition, slash piles, and local fire restrictions
    - description: Colorado State Forest Service guidance, local fire district recommendations, prior mitigation receipts, and mitigation-proof template at singularity/business/mountain-homestead/wildfire-mitigation/
  process:
    steps:
      - description: Review structural ignitability for house, garage, sheds, barns, decks, fencing, and utility structures
      - description: Review defensible space by Zone 1, Zone 2, and Zone 3 around each structure
      - description: Identify ember traps such as gutters, decks, wood piles, pine needles, under-deck debris, fences, and vents
      - description: Rank wildfire mitigation tasks by consequence, likelihood, urgency, and cost-to-reduce
      - description: Record completed mitigation proof for insurance and future planning; mark tax-credit items as possible/verify only
  outputs:
    - description: Monthly wildfire mitigation review
    - description: Defensible-space task list by zone
    - description: Home-hardening and ember-trap checklist
    - description: Mitigation proof notes and photos
  state:
    status: active
  dependencies:
    - loop_id: mountain-homestead-maintenance
  last_run: null
  output_shelves:
    - singularity/business/mountain-homestead/wildfire-mitigation/
